services:
  # Base de Datos Relacional Central (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: consorcio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consorcio_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Secr3tP@ssw0rd}
      POSTGRES_DB: ${POSTGRES_DB:-consorcio_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consorcio_admin} -d ${POSTGRES_DB:-consorcio_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - consorcio_net

  # Cache y Colas para Debounce y Sesiones (Redis)
  redis:
    image: redis:7-alpine
    container_name: consorcio_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - consorcio_net

  # Pasarela WhatsApp: Evolution API v2
  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    container_name: consorcio_evolution_api
    restart: always
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-consorcio_admin}:${POSTGRES_PASSWORD:-Secr3tP@ssw0rd}@postgres:5432/${POSTGRES_DB:-consorcio_db}?schema=evolution
      - REDIS_URI=redis://redis:6379/1
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-consorcio_api_token_secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - consorcio_net

  # API Gateway & Backend Central (FastAPI)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: consorcio_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-consorcio_admin}:${POSTGRES_PASSWORD:-Secr3tP@ssw0rd}@postgres:5432/${POSTGRES_DB:-consorcio_db}
      - REDIS_URL=redis://redis:6379/0
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-consorcio_api_token_secret}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - HTTP_CLIENT_TIMEOUT=90.0
      - PYTHONPATH=/app/apps/api/src:/app/apps/chatbot/src
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/chatbot/src:/app/apps/chatbot/src
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      evolution-api:
        condition: service_started
    networks:
      - consorcio_net

  # Motor del Chatbot e Inferencia IA Local (LangGraph)
  # Recursos asignados: 8GB RAM + 6 hilos para IA local en CPU
  chatbot-engine:
    build:
      context: .
      dockerfile: apps/chatbot/Dockerfile
    container_name: consorcio_chatbot_engine
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-consorcio_admin}:${POSTGRES_PASSWORD:-Secr3tP@ssw0rd}@postgres:5432/${POSTGRES_DB:-consorcio_db}
      - REDIS_URL=redis://redis:6379/0
      - API_URL=http://api:8000
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-consorcio_api_token_secret}
      - OPENROUTER_KEY=${OPENROUTER_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ADMIN_TELEFONO_GUARDIA=${ADMIN_TELEFONO_GUARDIA}
      - ADMIN_EMAIL_COBRANZAS=${ADMIN_EMAIL_COBRANZAS}
      - DEBOUNCE_SECONDS=12
      - DEBOUNCE_JITTER_SECONDS=3
      - QUIET_HOURS_START=00:00
      - QUIET_HOURS_END=07:30
      - OFFICE_HOURS_MF_START=10:00
      - OFFICE_HOURS_MF_END=18:00
      - OFFICE_HOURS_SAT_START=10:00
      - OFFICE_HOURS_SAT_END=13:00
      - WHISPER_MODEL=small
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_THREADS=6
      - PYTHONPATH=/app/apps/chatbot/src:/app/apps/api/src
    deploy:
      resources:
        limits:
          memory: 8192M
          cpus: '6.0'
    volumes:
      - ./apps/chatbot/src:/app/apps/chatbot/src
      - ./apps/api/src:/app/apps/api/src
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    networks:
      - consorcio_net

  # Frontend Customizado (Dashboard Administrativo Dra. Ivana Seliz)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: consorcio_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_TIMEOUT_MS=90000
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    networks:
      - consorcio_net

networks:
  consorcio_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
